version: '3.8'

services:
  # PostgreSQL Database with persistent volume and health check
  postgres:
    image: postgres:16-alpine
    container_name: monitoring-postgres
    restart: always
    environment:
      POSTGRES_DB: monitoringdb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitoringdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-net

  # Redis for session caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: monitoring-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-net

  # Java Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitoring-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitoringdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    networks:
      - monitoring-net

  # React Vite Frontend Service with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monitoring-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - monitoring-net

volumes:
  postgres_data:
    name: monitoring_postgres_data
  redis_data:
    name: monitoring_redis_data

networks:
  monitoring-net:
    name: monitoring_network
    driver: bridge
